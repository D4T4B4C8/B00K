<title>Dastaan-e-Kitab — Order Your Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#0c0c14;
    --ink-soft:#5a5670;
    --paper:#fff9f2;
    --hot:#ff2f92;
    --cyan:#00d9e8;
    --yellow:#ffd400;
    --violet:#7b2ff7;
    --orange:#ff6a00;
    --lime:#a4ff2f;
    --panel-border: 4px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,47,146,0.35), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(0,217,232,0.30), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(123,47,247,0.30), transparent 45%),
      #12111c;
    background-attachment:fixed;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: clamp(14px, 4vw, 48px) 14px;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1.4px);
    background-size: 14px 14px;
    mix-blend-mode: overlay;
    opacity:0.5;
  }

  .stage{
    width:100%;
    max-width:620px;
    position:relative;
  }

  .book{
    position:relative;
    width:100%;
    background:var(--paper);
    border: var(--panel-border) solid var(--ink);
    border-radius:18px;
    box-shadow: 10px 10px 0 rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.04) inset;
    overflow:hidden;
  }
  .page{
    position:relative;
    padding: clamp(22px,5vw,44px) clamp(18px,5vw,42px) clamp(26px,5vw,40px);
    min-height: 560px;
    display:none;
    flex-direction:column;
  }
  .page.active{display:flex;}

  /* Gives the last field on the info page (email) room to scroll clear
     of the on-screen keyboard on phones, instead of the keyboard just
     covering it. */
  .kb-spacer{ height:0; }
  @media (max-width: 600px){
    .kb-spacer{ height:45vh; }
  }
  .field input{ scroll-margin: 24px 0; }

  /* splash blob behind headline */
  .splash{
    position:absolute;
    z-index:0;
    filter: blur(2px);
    opacity:0.9;
    pointer-events:none;
  }
  .splash-1{ top:-40px; left:-40px; width:180px; height:180px;
    background: radial-gradient(circle, var(--hot), transparent 70%); }
  .splash-2{ top:-20px; right:-50px; width:200px; height:200px;
    background: radial-gradient(circle, var(--cyan), transparent 70%); }

  .head-wrap{ position:relative; z-index:1; margin-bottom:6px; }
  .kicker{
    display:inline-block;
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size: clamp(0.7rem, 2vw, 0.8rem);
    letter-spacing:0.14em;
    color:#fff;
    background:var(--violet);
    padding:5px 14px;
    border-radius:999px;
    border:3px solid var(--ink);
    transform: rotate(-3deg);
    margin-bottom:14px;
  }
  .headline{
    font-family:'Bangers',cursive;
    font-weight:400;
    letter-spacing:0.02em;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    line-height:0.95;
    color:var(--ink);
    -webkit-text-stroke: 1.5px var(--ink);
    text-shadow: 4px 4px 0 var(--hot), 7px 7px 0 var(--ink);
    margin:0 0 6px 0;
  }
  .subtitle{
    position:relative; z-index:1;
    font-size: clamp(0.85rem, 2.4vw, 0.98rem);
    font-weight:500;
    color:var(--ink-soft);
    margin:0 0 20px 0;
  }

  /* ---------- Page 1: Books ---------- */
  .book-list{
    display:flex;
    flex-direction:column;
    gap:16px;
    flex:1;
    position:relative;
    z-index:1;
  }
  .book-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px;
    border-radius:14px;
    border:3px solid var(--ink);
    background:#fff;
    box-shadow:5px 5px 0 rgba(0,0,0,0.85);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .book-row:nth-child(odd){ transform:rotate(-0.6deg); }
  .book-row:nth-child(even){ transform:rotate(0.6deg); }
  .book-row:hover{ transform:translateY(-2px) rotate(0deg); }
  .book-row.is-checked{
    background: linear-gradient(135deg, #fff 60%, rgba(255,212,0,0.25));
  }
  .cover{
    width: clamp(64px, 15vw, 92px);
    height: clamp(90px, 21vw, 128px);
    object-fit:cover;
    border-radius:6px;
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 rgba(0,0,0,0.5);
    flex-shrink:0;
  }
  .book-meta{flex:1; min-width:0;}
  .book-title{
    font-weight:800;
    font-size: clamp(0.95rem, 2.6vw, 1.15rem);
    color:var(--ink);
    margin:0 0 4px 0;
    line-height:1.15;
  }
  .book-price{
    display:inline-block;
    font-weight:800;
    font-size:0.85rem;
    color:#fff;
    background:var(--ink);
    padding:2px 10px;
    border-radius:999px;
  }
  .checkbox{
    width:38px;
    height:38px;
    border:3px solid var(--ink);
    border-radius:10px;
    flex-shrink:0;
    cursor:pointer;
    position:relative;
    background:#fff;
    box-shadow:3px 3px 0 rgba(0,0,0,0.5);
    transition: transform .1s ease, background .15s ease;
  }
  .checkbox:active{ transform: scale(0.9); }
  .checkbox.checked{
    background:var(--lime);
  }
  .checkbox.checked::after{
    content:"";
    position:absolute;
    left:11px; top:5px;
    width:9px; height:18px;
    border:solid var(--ink);
    border-width:0 4px 4px 0;
    transform:rotate(40deg);
  }

  .total-strip{
    position:relative; z-index:1;
    margin-top:20px;
    padding:16px 18px;
    border-radius:14px;
    border:3px solid var(--ink);
    background:var(--yellow);
    box-shadow:5px 5px 0 rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:space-between;
    transform: rotate(-0.4deg);
  }
  .total-strip .label{
    font-weight:800;
    font-size:0.9rem;
    letter-spacing:0.04em;
    color:var(--ink);
  }
  .total-strip .value{
    font-family:'Bangers',cursive;
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    color:var(--ink);
  }

  /* ---------- Buttons ---------- */
  .btn-row{
    display:flex;
    justify-content:center;
    margin-top:26px;
    position:relative; z-index:1;
  }
  .btn-next, .btn-paid{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size: clamp(0.95rem, 3vw, 1.05rem);
    letter-spacing:0.02em;
    color:var(--ink);
    background:var(--lime);
    border:3px solid var(--ink);
    padding: 14px 42px;
    border-radius:999px;
    cursor:pointer;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.85);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-next:hover, .btn-paid:hover{ transform: translate(-2px,-2px); box-shadow: 7px 7px 0 rgba(0,0,0,0.85); }
  .btn-next:active, .btn-paid:active{ transform: translate(2px,2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.85); }
  .btn-next:disabled{
    background:#d8d4e6;
    color:#8f8aa3;
    box-shadow:none;
    cursor:not-allowed;
    transform:none;
  }
  .btn-back{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:0.85rem;
    color:#fff;
    background:var(--ink);
    border:3px solid var(--ink);
    border-radius:999px;
    cursor:pointer;
    padding:7px 16px;
    align-self:flex-start;
    margin-bottom:16px;
    position:relative; z-index:1;
  }
  .btn-back:hover{ background:var(--violet); }

  /* ---------- Page 2: Info ---------- */
  .field{
    margin-bottom:20px;
    position:relative; z-index:1;
  }
  .field label{
    display:inline-block;
    font-size: clamp(0.85rem, 2.4vw, 0.95rem);
    font-weight:800;
    color:#fff;
    margin-bottom:8px;
    padding:3px 12px;
    border-radius:8px;
    border:2.5px solid var(--ink);
  }
  .field:nth-of-type(5n+1) label{ background:var(--hot); }
  .field:nth-of-type(5n+2) label{ background:var(--cyan); color:var(--ink); }
  .field:nth-of-type(5n+3) label{ background:var(--violet); }
  .field:nth-of-type(5n+4) label{ background:var(--orange); }
  .field:nth-of-type(5n+5) label{ background:var(--lime); color:var(--ink); }
  .field input{
    width:100%;
    border:3px solid var(--ink);
    border-radius:12px;
    background:#fff;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:1rem;
    color:var(--ink);
    padding:12px 14px;
    outline:none;
    box-shadow:4px 4px 0 rgba(0,0,0,0.5);
    transition: box-shadow .15s ease, transform .1s ease;
  }
  .field input:focus{ box-shadow:4px 4px 0 var(--hot); transform:translate(-1px,-1px); }
  .field input.error{ border-color:#e0225a; }
  .hint{
    font-size:0.75rem;
    font-weight:700;
    color:#e0225a;
    margin-top:6px;
    min-height:14px;
  }

  /* ---------- Page 3: Payment ---------- */
  .amount-block{
    position:relative; z-index:1;
    text-align:center;
    margin:4px 0 24px 0;
  }
  .amount-block .tag{
    font-weight:800;
    font-size:0.8rem;
    color:#fff;
    background:var(--ink);
    display:inline-block;
    padding:4px 14px;
    border-radius:999px;
    letter-spacing:0.08em;
  }
  .amount-block .amt{
    font-family:'Bangers',cursive;
    font-size: clamp(3.4rem, 16vw, 5.2rem);
    line-height:1;
    color:var(--ink);
    text-shadow: 5px 5px 0 var(--orange), 9px 9px 0 var(--ink);
    margin-top:10px;
  }
  .amount-block .amt sup{
    font-size:0.4em;
    margin-right:4px;
  }

  .qr-wrap{
    position:relative; z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:6px;
  }
  .qr-frame{
    background:#fff;
    padding:14px;
    border-radius:14px;
    border:3px solid var(--ink);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.85);
  }
  .qr-frame img{ display:block; width:min(50vw,180px); height:min(50vw,180px); }
  .upi-note{
    font-size:0.82rem;
    font-weight:600;
    color:var(--ink-soft);
    text-align:center;
    max-width:300px;
  }
  .pay-link{
    display:inline-block;
    margin-top:2px;
    font-weight:800;
    font-size:0.9rem;
    color:#fff;
    background:var(--violet);
    text-decoration:none;
    padding:8px 18px;
    border-radius:999px;
    border:2.5px solid var(--ink);
  }
  .order-summary{
    position:relative; z-index:1;
    margin-top:24px;
    padding:14px 16px;
    border-radius:12px;
    border:2.5px dashed var(--ink);
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink);
  }
  .order-summary div{margin-bottom:4px;}

  .screenshot-step{
    position:relative; z-index:1;
    margin-top:22px;
    padding:16px 18px;
    border-radius:14px;
    border:3px solid var(--ink);
    background:#fff;
    box-shadow:5px 5px 0 rgba(0,0,0,0.85);
    text-align:center;
  }
  .step-label{
    font-weight:800;
    font-size:0.82rem;
    letter-spacing:0.04em;
    color:var(--violet);
    margin:0 0 6px 0;
    text-transform:uppercase;
  }
  .step-text{
    font-size:0.86rem;
    font-weight:500;
    color:var(--ink-soft);
    margin:0 0 14px 0;
    line-height:1.4;
  }
  .mail-btn{
    display:inline-block;
    font-weight:800;
    font-size:0.92rem;
    color:var(--ink);
    background:var(--cyan);
    border:3px solid var(--ink);
    padding:10px 22px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:4px 4px 0 rgba(0,0,0,0.85);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .mail-btn:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 rgba(0,0,0,0.85); }
  .mail-btn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.85); }

  .waiting-note{
    position:relative; z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:22px;
    font-weight:700;
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .waiting-dot{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--orange);
    animation: pulseDot 1.1s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ transform:scale(0.7); opacity:0.6; }
    50%{ transform:scale(1.15); opacity:1; }
  }
  .btn-row.reveal{
    animation: revealUp .35s ease both;
  }
  @keyframes revealUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .success-block{
    position:relative; z-index:1;
    text-align:center;
    padding: 20px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .success-emoji{ font-size:3.2rem; }
  .success-title{
    font-family:'Bangers',cursive;
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    color:var(--ink);
    text-shadow: 3px 3px 0 var(--lime);
  }
  .success-msg{
    font-weight:600;
    font-size:1rem;
    color:var(--ink-soft);
    max-width:340px;
  }

  /* ---------- Admin page (#whitex) ---------- */
  .admin-page{
    padding: clamp(20px, 4vw, 36px);
    min-height:100vh;
    max-width:960px;
    margin:0 auto;
    font-family:'Poppins',sans-serif;
    color:#fff;
  }
  .admin-title{
    font-family:'Bangers',cursive;
    font-size: clamp(2rem, 6vw, 2.8rem);
    color:#fff;
    text-shadow: 4px 4px 0 var(--hot);
    margin-bottom:6px;
  }
  .admin-sub{color:#c9c6db; font-size:0.9rem; margin-bottom:20px;}
  .table-scroll{overflow-x:auto; border-radius:12px; border:3px solid var(--ink);}
  table{
    width:100%;
    border-collapse:collapse;
    background:#fff9f2;
    color:var(--ink);
  }
  th,td{
    text-align:left;
    padding:10px 14px;
    font-size:0.82rem;
    border-bottom:2px solid #eee;
    white-space:nowrap;
  }
  th{
    background:var(--ink);
    color:#fff;
    font-weight:700;
    position:sticky;

// ---------- validation ----------
function validateInfo(){
  const i = state.info;
  let ok = true;
  const setErr = (fieldId, hintId, msg) => {
    document.getElementById(fieldId).classList.add('error');
    document.getElementById(hintId).textContent = msg;
    ok = false;
  };
  const clearErr = (fieldId, hintId) => {
    document.getElementById(fieldId).classList.remove('error');
    document.getElementById(hintId).textContent = '';
  };

  if (!i.name.trim()) setErr('fName','hName','Please enter your name'); else clearErr('fName','hName');
  if (!i.city.trim()) setErr('fCity','hCity','Please enter your city'); else clearErr('fCity','hCity');
  if (!/^\d{10}$/.test(i.phone.trim())) setErr('fPhone','hPhone','Enter a valid 10-digit number'); else clearErr('fPhone','hPhone');
  if (!i.insta.trim()) setErr('fInsta','hInsta','Please enter your Instagram username'); else clearErr('fInsta','hInsta');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i.email.trim())) setErr('fEmail','hEmail','Enter a valid email'); else clearErr('fEmail','hEmail');

  return ok;
}

// ---------- storage (Netlify Blobs via our own /api/orders function,
// local fallback only if that call fails, e.g. no network) ----------
async function storageSet(key, valueObj){
  const value = JSON.stringify(valueObj);
  try{
    const res = await fetch(ORDERS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, order: valueObj }),
    });
    if (!res.ok) throw new Error('orders API responded ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'orders API returned ok:false');
    hasCloud = true;
    return 'cloud';
  }catch(e){
    console.error('cloud order save failed, falling back to local storage', e);
    hasCloud = false;
  }
  try{
    localStorage.setItem('dek_' + key, value);
    return 'local';
  }catch(e){ console.error('local storage set failed', e); }
  return null;
}

async function storageGetAllOrders(){
  const orders = {};
  try{
    const res = await fetch(ORDERS_API);
    if (!res.ok) throw new Error('orders API responded ' + res.status);
    const data = await res.json();
    if (data && data.orders) Object.assign(orders, data.orders);
    hasCloud = true;
  }catch(e){
    console.error('cloud order list failed', e);
    hasCloud = false;
  }
  try{
    for (let idx=0; idx<localStorage.length; idx++){
      const k = localStorage.key(idx);
      if (k && k.startsWith('dek_order_')){
        const realKey = k.slice(4);
        if (!orders[realKey]){
          try{ orders[realKey] = JSON.parse(localStorage.getItem(k)); }catch(e){}
        }
      }
    }
  }catch(e){ /* localStorage may be unavailable */ }
  return orders;
}

async function saveOrder(){
  const key = 'order_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const order = {
    date: new Date().toISOString(),
    books: selectedBooks().map(b=>b.title),
    total: total(),
    name: state.info.name,
    city: state.info.city,
    phone: state.info.phone,
    insta: state.info.insta,
    email: state.info.email,
    paid: false,
  };
  const where = await storageSet(key, order);
  state.lastOrderKey = key;
  state.lastOrderWhere = where;
  return order;
}

async function markOrderPaid(){
  if (!state.lastOrderKey) return;
  const key = state.lastOrderKey;
  // re-read, flip paid flag, re-save
  const order = {
    date: new Date().toISOString(),
    books: selectedBooks().map(b=>b.title),
    total: total(),
    name: state.info.name,
    city: state.info.city,
    phone: state.info.phone,
    insta: state.info.insta,
    email: state.info.email,
    paid: true,
  };
  await storageSet(key, order);
}

// ---------- event handlers ----------
function attachPageHandlers(){
  if (state.page === 'books'){
    document.querySelectorAll('.checkbox').forEach(cb=>{
      cb.addEventListener('click', ()=>{
        const id = cb.dataset.book;
        state.selected[id] = !state.selected[id];
        render();
      });
    });
    const nextBtn = document.getElementById('toInfo');
    if (nextBtn) nextBtn.addEventListener('click', ()=>{
      if (total() === 0) return;
      state.page = 'info';
      render();
    });
  }

  if (state.page === 'info'){
    document.getElementById('backToBooks').addEventListener('click', ()=>{
      state.page = 'books';
      render();
    });
    const ids = [['fName','name'],['fCity','city'],['fPhone','phone'],['fInsta','insta'],['fEmail','email']];
    ids.forEach(([elId,key])=>{
      const el = document.getElementById(elId);
      el.addEventListener('input', (e)=>{
        state.info[key] = e.target.value;
      });
      // On phones, the keyboard popping up can cover the field the user
      // just tapped (especially the last one, email). Nudge it into view
      // once the keyboard has finished animating in.
      el.addEventListener('focus', ()=>{
        setTimeout(()=>{
          el.scrollIntoView({ behavior:'smooth', block:'center' });
        }, 300);
      });
    });
    document.getElementById('toPayment').addEventListener('click', async ()=>{
      if (!validateInfo()) return;
      const btn = document.getElementById('toPayment');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      await saveOrder();
      state.page = 'payment';
      render();
    });
  }

  if (state.page === 'payment'){
    document.getElementById('backToInfo').addEventListener('click', ()=>{
      cleanupPaymentWatchers();
      state.page = 'info';
      render();
    });
    const holder = document.getElementById('qrHolder');
    if (holder && window.QRCode){
      holder.innerHTML = '';
      new QRCode(holder, {
        text: upiLink(total()),
        width: 180,
        height: 180,
        colorDark: '#0c0c14',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
    const paidBtn = document.getElementById('manualDone');
    paidBtn.addEventListener('click', async ()=>{
      cleanupPaymentWatchers();
      paidBtn.disabled = true;
      paidBtn.textContent = 'Confirming…';
      await markOrderPaid();
      state.page = 'success';
      render();
    });

    // The person emails a screenshot of their successful payment to
    // dastaanekitab@gmail.com. When they switch back to this tab after
    // opening their mail app, we auto-advance to the final message.
    // This is a UX nudge, not a verified payment confirmation — a manual
    // fallback button appears shortly after in case auto-detection misses.
    const mailLink = document.getElementById('sendScreenshot');
    let attempted = false;
    let finished = false;

    const goToSuccess = async ()=>{
      if (finished) return;
      finished = true;
      cleanupPaymentWatchers();
      await markOrderPaid();
      state.page = 'success';
      render();
    };

    const showFallbackBtn = ()=>{
      const row = document.getElementById('paidBtnRow');
      const note = document.getElementById('waitingNote');
      if (!row || row.style.display === 'flex') return;
      row.style.display = 'flex';
      row.classList.add('reveal');
      if (note) note.textContent = "Sent it already? Tap the button below.";
    };

    const onVisible = ()=>{
      if (document.visibilityState === 'visible' && attempted) goToSuccess();
    };

    if (mailLink){
      mailLink.addEventListener('click', ()=>{ attempted = true; });
    }
    document.addEventListener('visibilitychange', onVisible);

    const fallbackTimer = setTimeout(showFallbackBtn, 6000);

    state._paymentCleanup = ()=>{
      document.removeEventListener('visibilitychange', onVisible);
      clearTimeout(fallbackTimer);
    };
  }
}

function cleanupPaymentWatchers(){
  if (state._paymentCleanup){
    state._paymentCleanup();
    state._paymentCleanup = null;
  }
}

// ---------- admin ----------
function renderAdmin(){
  return `
    <div class="admin-page">
      <h1 class="admin-title">Order log</h1>
      <p class="admin-sub">All book orders submitted through the form.</p>
      <button class="refresh-btn" id="refreshAdmin">Refresh</button>
      <div id="adminTableWrap"><p class="empty-note">Loading…</p></div>
      <div class="storage-note" id="storageNote">
        ${hasCloud
          ? "Orders are saved to shared cloud storage (Netlify Blobs), so this log shows every order placed by anyone, from any device."
          : "Couldn't reach the orders API just now, so this log is showing only what's saved in this browser's local storage. Refresh once you're back online to see every order."}
      </div>
    </div>
  `;
}

async function loadAdminData(){
  const wrap = document.getElementById('adminTableWrap');
  const refreshBtn = document.getElementById('refreshAdmin');
  if (refreshBtn) refreshBtn.addEventListener('click', loadAdminData);
  try{
    const ordersMap = await storageGetAllOrders();
    const note = document.getElementById('storageNote');
    if (note){
      note.textContent = hasCloud
        ? "Orders are saved to shared cloud storage (Netlify Blobs), so this log shows every order placed by anyone, from any device."
        : "Couldn't reach the orders API just now, so this log is showing only what's saved in this browser's local storage. Refresh once you're back online to see every order.";
    }
    const orders = Object.values(ordersMap);
    if (orders.length === 0){
      wrap.innerHTML = '<p class="empty-note">No orders yet.</p>';
      return;
    }
    orders.sort((a,b)=> new Date(b.date) - new Date(a.date));
    const rows = orders.map(o=>`
      <tr>
        <td>${new Date(o.date).toLocaleString()}</td>
        <td>${o.name || ''}</td>
        <td>${o.city || ''}</td>
        <td>${o.phone || ''}</td>
        <td>${o.insta || ''}</td>
        <td>${o.email || ''}</td>
        <td>${(o.books||[]).join(', ')}</td>
        <td>₹${o.total}</td>
        <td>${o.paid ? 'Screenshot sent' : 'Pending'}</td>
      </tr>
    `).join('');
    wrap.innerHTML = `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Name</th><th>City</th><th>Phone</th><th>Instagram</th><th>Email</th><th>Books</th><th>Total</th><th>Screenshot</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }catch(e){
    wrap.innerHTML = '<p class="empty-note">Could not load orders.</p>';
    console.error(e);
  }
}

window.addEventListener('hashchange', render);
render();
</script>
