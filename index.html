  }

    display:block;
    margin:-6px auto 18px;

  }

  main{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:10px 24px 60px;
  }

  .shelf-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:10px 0 46px;
    color:var(--ink-soft);
    font-family:'Kalam', cursive;
  }
  .shelf-divider::before, .shelf-divider::after{
    content:"";
    height:2px;
    width:90px;
    background:repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:38px 30px;
    justify-items:center;
  }

  .book-btn{
    all:unset;
    cursor:pointer;
    display:block;
    width:100%;
    max-width:230px;
  }

  .card{
    position:relative;
    background:#fffdf9;
    padding:14px 14px 20px;
    border-radius:4px;
    box-shadow: 0 10px 22px -8px rgba(58,46,39,0.28), 0 2px 4px rgba(58,46,39,0.12);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.2), box-shadow .35s ease;
    transform: rotate(var(--tilt,-2deg));
  }

  .book-btn:nth-child(4n+1) .card{ --tilt: -3deg; }
  .book-btn:nth-child(4n+2) .card{ --tilt: 2deg; }
  .book-btn:nth-child(4n+3) .card{ --tilt: -1.5deg; }
  .book-btn:nth-child(4n+4) .card{ --tilt: 2.5deg; }

  .book-btn:hover .card, .book-btn:focus-visible .card{
    transform: rotate(0deg) translateY(-10px) scale(1.035);
    box-shadow: 0 22px 34px -10px rgba(58,46,39,0.35), 0 4px 10px rgba(58,46,39,0.18);
  }

  .tape{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:78px;
    height:26px;
    opacity:0.9;
    box-shadow:0 2px 3px rgba(0,0,0,0.12);
  }

  .cover-wrap{
    position:relative;
    overflow:hidden;
    border-radius:2px;
    border:1px solid rgba(58,46,39,0.12);
  }
  .cover-wrap img{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio: 2 / 3;
    object-fit:cover;
  }

  .cover-badge{
    position:absolute;
    bottom:8px;
    right:8px;
    font-family:'Kalam', cursive;
    font-size:0.72rem;
    background:var(--ink);
    color:var(--paper);
    padding:3px 9px;
    border-radius:999px;
    opacity:0;
    transform:translateY(6px);
    transition:all .25s ease;
  }
  .book-btn:hover .cover-badge, .book-btn:focus-visible .cover-badge{
    opacity:1;
    transform:translateY(0);
  }

  .book-title{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:1.02rem;
    margin-top:12px;
    line-height:1.25;
    color:var(--ink);
  }

  .book-meta{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
    font-family:'Patrick Hand', cursive;
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:20px 20px 70px;
    font-family:'Kalam', cursive;
    color:var(--ink-soft);
  }
  footer .quote{
    font-size:1.3rem;

    color:var(--ink);
  }
  footer .signature{
    font-family:'Caveat', cursive;
    font-size:1.6rem;
    color:var(--coral);
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(41,31,25,0.72);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:50;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox-card{
    background:#fffdf9;
    border-radius:8px;
    padding:22px;
    max-width:420px;
    width:100%;
    text-align:center;
    transform:translateY(14px) scale(0.96);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .lightbox.open .lightbox-card{ transform:translateY(0) scale(1); }
  .lightbox-card img{
    width:70%;
    max-width:220px;
    border-radius:3px;
    box-shadow:0 12px 24px rgba(0,0,0,0.25);
  }
  .lightbox-card h2{
    font-family:'Caveat', cursive;
    font-size:2.1rem;
    margin:14px 0 4px;
    color:var(--ink);
  }
  .lightbox-card p{
    font-family:'Kalam', cursive;
    color:var(--ink-soft);
    font-size:0.95rem;
    margin:0 0 16px;
  }
  .close-btn{
    all:unset;
    cursor:pointer;
    font-family:'Kalam', cursive;
    font-weight:700;
    background:var(--ink);
    color:var(--paper);
    padding:9px 20px;
    border-radius:999px;
    font-size:0.95rem;
  }
  .close-btn:hover{ background:var(--coral); }

  @media (max-width: 980px){
    .grid{ grid-template-columns:repeat(3, 1fr); gap:30px 22px; }
  }
  @media (max-width: 700px){
    .grid{ grid-template-columns:repeat(2, 1fr); gap:26px 16px; }
    header{ padding:60px 16px 30px; }
  }
  @media (max-width: 480px){
    header{ padding:50px 10px 26px; }
    .doodle[style*="left:1%"], .doodle[style*="right:1.5%"]{ display:none; }
  }
  @media (max-width: 420px){
    .grid{ grid-template-columns:1fr 1fr; gap:22px 12px; }
    .book-btn{ max-width:170px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
